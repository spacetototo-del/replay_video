media3 = "1.3.1"
playServicesWearable = "18.2.0"
datastore = "1.1.1"
wearComposeMaterial = "1.3.1"
wear = "1.3.0"
coroutinesPlayServices = "1.8.0"
coroutinesAndroid = "1.8.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
